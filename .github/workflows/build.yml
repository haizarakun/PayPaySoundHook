# APK を GitHub 側でビルドする。
# Actions タブから手動で走らせると、成果物がアーティファクトとして落とせる。
#
# ここでできる APK は未署名。配布するときは手元で apksigner で署名し直すこと。
# 取り違えないよう、ファイル名に -unsigned を付けて出す。
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Ubuntu のランナーには Android SDK が入っているので、足りない分だけ入れる。
      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          ls "$ANDROID_HOME/platforms"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      # app/build.gradle の versionName をそのままファイル名に使う。
      - name: Name the APK
        run: |
          VERSION=$(sed -n "s/.*versionName *'\(.*\)'.*/\1/p" app/build.gradle | head -n 1)
          cd app/build/outputs/apk/release
          for f in *.apk; do
            mv "$f" "PayPaySoundHook-v${VERSION}-unsigned.apk"
          done
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: PayPaySoundHook-apk-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
